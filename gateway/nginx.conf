# API Gateway — único punto de entrada al sistema (https://tienda.ujap.test)
events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # DNS interno de Docker. Al usar variables en proxy_pass, Nginx resuelve los nombres
  # en cada petición: así arranca aunque algún microservicio todavía no esté listo.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Límite de intentos por dirección IP en las rutas de acceso. Al pasarse se responde 429.
  #   acceso:  login y registro (fuerza bruta de contraseñas): 10 por minuto + ráfaga de 10.
  #   codigos: escribir un código recibido por correo: 10 por minuto + ráfaga de 20 (además,
  #            cada código se anula tras 5 fallos, así que adivinarlo es inútil).
  #   correos: pedir que se envíe un correo (para no llenar el buzón de nadie): 5 por minuto + 5.
  limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=codigos:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=correos:10m rate=5r/m;
  limit_req_status 429;

  # Mensaje para cada motivo de rechazo que informa el servicio de usuarios (cabecera X-Motivo)
  map $motivo_sesion $mensaje_sesion {
    expirado "Tu sesión expiró, vuelve a iniciar sesión";
    revocado "Tu sesión fue cerrada, vuelve a iniciar sesión";
    default  "Token inválido";
  }

  # ─── HTTP: todo se redirige a HTTPS (308 conserva el método, p. ej. un POST sigue siendo POST) ───
  server {
    listen 80;
    server_name tienda.ujap.test localhost;
    include /etc/nginx/puerto-https.conf;  # define $puerto_https (lo escribe 15-certificado.sh)
    location / { return 308 https://$host$puerto_https$request_uri; }
  }

  # ─── HTTPS ───
  server {
    listen 443 ssl;
    http2 on;
    server_name tienda.ujap.test localhost;

    # Certificado de desarrollo firmado por la CA local (lo crea 15-certificado.sh la primera vez)
    ssl_certificate     /etc/nginx/certificados/tienda.crt;
    ssl_certificate_key /etc/nginx/certificados/tienda.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    # No se envía Strict-Transport-Security (HSTS): con un certificado que el navegador todavía no
    # conoce, HSTS impediría entrar aceptando la advertencia.

    # Certificado público de la CA local, para importarlo y que el navegador confíe en el sitio
    location = /ca-tienda-ujap.crt {
      alias /etc/nginx/certificados/ca.crt;
      default_type application/x-x509-ca-cert;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # ─── API: antes de pasar cada petición, el servicio de usuarios revisa que la sesión siga abierta ───
    # Así un token deja de valer en el acto al cerrar sesión, al cambiar la contraseña o el rol,
    # o al eliminar la cuenta, aunque todavía no haya expirado.
    location /api/ {
      auth_request /_verificar_sesion;
      auth_request_set $motivo_sesion $upstream_http_x_motivo;
      error_page 401 = @sesion_no_valida;
      error_page 500 = @autenticacion_caida;

      # Endpoints internos: solo se usan entre microservicios, nunca desde fuera
      location ~ ^/api/productos/[^/]+/(reservar|liberar)$ {
        default_type application/json;
        return 403 '{"detail":"Endpoint interno: solo accesible entre microservicios"}';
      }
      location = /api/eventos {
        default_type application/json;
        if ($request_method != GET) {
          return 403 '{"detail":"Endpoint interno: solo accesible entre microservicios"}';
        }
        set $destino servicio-actividad:8080;
        proxy_pass http://$destino;
      }

      # Rutas de acceso, con límite de intentos
      location ~ ^/api/auth/(login|registro)$ {
        limit_req zone=acceso burst=10 nodelay;
        error_page 401 = @sesion_no_valida;
        error_page 429 = @demasiados_intentos;
        error_page 500 = @autenticacion_caida;
        set $destino servicio-usuarios:8000;
        proxy_pass http://$destino;
      }
      location ~ ^/api/auth/(verificar-correo|restablecer)$ {
        limit_req zone=codigos burst=20 nodelay;
        error_page 401 = @sesion_no_valida;
        error_page 429 = @demasiados_intentos;
        error_page 500 = @autenticacion_caida;
        set $destino servicio-usuarios:8000;
        proxy_pass http://$destino;
      }
      location ~ ^/api/auth/(reenviar-codigo|recuperar)$ {
        limit_req zone=correos burst=5 nodelay;
        error_page 401 = @sesion_no_valida;
        error_page 429 = @demasiados_intentos;
        error_page 500 = @autenticacion_caida;
        set $destino servicio-usuarios:8000;
        proxy_pass http://$destino;
      }

      # Rutas de la API → microservicio correspondiente.
      # Sin URI en proxy_pass: la ruta llega completa al servicio (p. ej. /api/usuarios/3).
      location /api/auth      { set $destino servicio-usuarios:8000;  proxy_pass http://$destino; }
      location /api/usuarios  { set $destino servicio-usuarios:8000;  proxy_pass http://$destino; }
      location /api/productos { set $destino servicio-productos:3000; proxy_pass http://$destino; }
      location /api/pedidos   { set $destino servicio-pedidos:8080;   proxy_pass http://$destino; }
      location /api/eventos   { set $destino servicio-actividad:8080; proxy_pass http://$destino; }
    }

    # Subpetición de auth_request: solo la usa Nginx (internal), sin el cuerpo de la petición original.
    # Usa su propia variable: la subpetición comparte las variables con la petición original y
    # cambiar $destino aquí la desviaría al servicio de usuarios.
    location = /_verificar_sesion {
      internal;
      set $destino_sesion servicio-usuarios:8000;
      proxy_pass http://$destino_sesion/interno/verificar;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location @sesion_no_valida {
      default_type application/json;
      add_header WWW-Authenticate Bearer always;
      return 401 '{"detail":"$mensaje_sesion"}';
    }
    location @autenticacion_caida {
      default_type application/json;
      return 503 '{"detail":"El servicio de usuarios no responde: no se puede comprobar la sesión"}';
    }
    location @demasiados_intentos {
      default_type application/json;
      add_header Retry-After 60 always;
      return 429 '{"detail":"Demasiados intentos. Espera un minuto antes de volver a intentarlo"}';
    }

    # ─── Estado de cada microservicio (lo consulta el frontend) ───
    location = /estado/usuarios  { set $destino servicio-usuarios:8000;  proxy_pass http://$destino/health; }
    location = /estado/productos { set $destino servicio-productos:3000; proxy_pass http://$destino/health; }
    location = /estado/pedidos   { set $destino servicio-pedidos:8080;   proxy_pass http://$destino/health; }
    location = /estado/actividad { set $destino servicio-actividad:8080; proxy_pass http://$destino/health; }

    # ─── Todo lo demás: el frontend ───
    location / { set $destino frontend:80; proxy_pass http://$destino; }
  }
}
