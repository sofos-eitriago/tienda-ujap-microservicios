spring.application.name=servicio-pedidos
server.port=${PORT:8080}

# PostgreSQL — Spring necesita la URL en formato JDBC (jdbc:postgresql://...)
# Los valores vienen de las variables de entorno que define docker-compose.yml
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tienda}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Secreto JWT compartido con los demás microservicios (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:secreto-de-desarrollo-cambiar-en-produccion-2026}

# URLs de los otros microservicios (nombres de servicio de Docker Compose)
servicios.usuarios.url=${USUARIOS_URL:http://localhost:8001}
servicios.productos.url=${PRODUCTOS_URL:http://localhost:8002}
servicios.actividad.url=${ACTIVIDAD_URL:http://localhost:8004}

# Recuperación automática de pedidos que quedaron a medias (estado PROCESANDO)
pedidos.recuperacion.antiguedad-seg=${PEDIDOS_RECUPERACION_SEG:60}
pedidos.recuperacion.intervalo-ms=${PEDIDOS_RECUPERACION_INTERVALO_MS:30000}
