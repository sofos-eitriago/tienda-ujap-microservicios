# Proyecto Final LPR07304 — Tienda en línea con microservicios
#
# PARTE 1 DE 6 — Infraestructura base: bases de datos (PostgreSQL y MongoDB) y API Gateway (Nginx).
# Los microservicios y el frontend se agregan a este archivo en las partes siguientes.
#
# Levantar la parte 1:
#   docker compose up -d --build
#
# Las variables ${...} se leen del archivo .env (si no existe, se usan los valores por defecto).
# Solo el gateway publica un puerto: las bases de datos no son accesibles desde fuera de Docker.

name: tienda-ujap

services:
  # ─────────────────────────── Bases de datos ───────────────────────────
  postgres:                         # SQL — la usarán servicio-usuarios y servicio-pedidos
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-admin123}
      POSTGRES_DB: ${DB_NAME:-tienda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mongodb:                          # NoSQL — la usarán servicio-productos y servicio-actividad
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin123}
    volumes:
      - mongodata:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ───────────────────────────── API Gateway ─────────────────────────────
  gateway:                          # Nginx: único punto de entrada al sistema
    build: ./gateway
    ports: ["${GATEWAY_PORT:-80}:80"]
    networks: [frontend]
    restart: unless-stopped

# Las bases de datos solo están en la red "backend": el gateway no puede llegar a ellas.
networks:
  backend:
  frontend:

volumes:
  pgdata:
  mongodata:
