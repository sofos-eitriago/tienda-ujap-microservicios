# Proyecto Final LPR07304 — Tienda en línea con microservicios
#
# PARTE 3 DE 6 — Infraestructura base + servicios de usuarios y de productos.
# Los demás microservicios y el frontend se agregan a este archivo en las partes siguientes.
#
# Levantar lo publicado hasta ahora:
#   docker compose up -d --build
#
# Las variables ${...} se leen del archivo .env (si no existe, se usan los valores por defecto).
# Solo el gateway publica un puerto: los microservicios y las bases de datos no son accesibles
# desde fuera de Docker.

name: tienda-ujap

# Configuración común a los microservicios
x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:-secreto-de-desarrollo-cambiar-en-produccion-2026}

services:
  # ─────────────────────────── Bases de datos ───────────────────────────
  postgres:                         # SQL — la usan servicio-usuarios y (parte 5) servicio-pedidos
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-admin123}
      POSTGRES_DB: ${DB_NAME:-tienda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mongodb:                          # NoSQL — la usan servicio-productos y (parte 4) servicio-actividad
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin123}
    volumes:
      - mongodata:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ──────────────── Microservicios con PostgreSQL (SQL) ────────────────
  servicio-usuarios:                # Python + FastAPI + SQLAlchemy — usuarios y login (emite los JWT)
    build: ./servicio-usuarios
    environment:
      <<: *jwt
      JWT_EXPIRA_MIN: ${JWT_EXPIRA_MIN:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tienda.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin2026!}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASS: ${DB_PASS:-admin123}
      DB_NAME: ${DB_NAME:-tienda}
      ACTIVIDAD_URL: http://servicio-actividad:8080   # servicio de la parte 4; mientras no exista solo se registra un aviso
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─────────────── Microservicios con MongoDB (NoSQL) ───────────────
  servicio-productos:               # Node.js + Express + Mongoose — catálogo y stock
    build: ./servicio-productos
    environment:
      <<: *jwt
      PORT: 3000
      MONGO_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-admin123}@mongodb:27017/${MONGO_DB:-tienda}?authSource=admin
      ACTIVIDAD_URL: http://servicio-actividad:8080   # servicio de la parte 4; mientras no exista solo se registra un aviso
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ───────────────────────────── API Gateway ─────────────────────────────
  gateway:                          # Nginx: único punto de entrada al sistema
    build: ./gateway
    ports: ["${GATEWAY_PORT:-80}:80"]
    depends_on:
      - servicio-usuarios
      - servicio-productos
    networks: [frontend]
    restart: unless-stopped

# Las bases de datos solo están en la red "backend": el gateway no puede llegar a ellas.
networks:
  backend:
  frontend:

volumes:
  pgdata:
  mongodata:
