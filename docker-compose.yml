# Proyecto Final LPR07304 — Tienda en línea con microservicios
#
# Levantar todo el sistema con un solo comando:
#   docker compose up --build
#
# Abrir: https://tienda.ujap.test
# (la primera vez hay que agregar ese nombre al archivo hosts y, para que el navegador no muestre
#  la advertencia del certificado, confiar en la CA local: configurar-dominio.ps1 hace las dos cosas)
#
# Las variables ${...} se leen del archivo .env (si no existe, se usan los valores por defecto).
# Solo el gateway publica puertos, y solo en esta máquina: los microservicios y las bases de datos no
# son accesibles desde fuera de Docker. Para depurar con puertos directos ver docker-compose.debug.yml.
# El buzón de pruebas Mailpit se abre en http://mailpit.correo (también en http://localhost:8025).

name: tienda-ujap

# Configuración común a los microservicios
x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:-secreto-de-desarrollo-cambiar-en-produccion-2026}

# Correo (usuarios y pedidos): por defecto va a Mailpit. Con un servidor SMTP real los correos salen a Internet.
x-correo: &correo
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USUARIO: ${SMTP_USUARIO:-}
  SMTP_CLAVE: ${SMTP_CLAVE:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  CORREO_REMITENTE: ${CORREO_REMITENTE:-Tienda UJAP <no-responder@tienda.ujap.test>}

services:
  # ─────────────────────────── Bases de datos ───────────────────────────
  postgres:                         # SQL — la usan servicio-usuarios y servicio-pedidos
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-admin123}
      POSTGRES_DB: ${DB_NAME:-tienda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mongodb:                          # NoSQL — la usan servicio-productos y servicio-actividad
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin123}
    volumes:
      - mongodata:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ──────────────── Microservicios con PostgreSQL (SQL) ────────────────
  servicio-usuarios:                # Python + FastAPI + SQLAlchemy — usuarios y login (emite los JWT)
    build: ./servicio-usuarios
    environment:
      <<: [*jwt, *correo]
      JWT_EXPIRA_MIN: ${JWT_EXPIRA_MIN:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tienda.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin2026!}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASS: ${DB_PASS:-admin123}
      DB_NAME: ${DB_NAME:-tienda}
      ACTIVIDAD_URL: http://servicio-actividad:8080
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  servicio-pedidos:                 # Java + Spring Boot + Spring Data JPA — pedidos (usa a los otros tres servicios y avisa por correo)
    build: ./servicio-pedidos
    environment:
      <<: [*jwt, *correo]
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASS: ${DB_PASS:-admin123}
      DB_NAME: ${DB_NAME:-tienda}
      USUARIOS_URL: http://servicio-usuarios:8000
      PRODUCTOS_URL: http://servicio-productos:3000
      ACTIVIDAD_URL: http://servicio-actividad:8080
    depends_on:
      postgres:
        condition: service_healthy
      servicio-usuarios:
        condition: service_started
      servicio-productos:
        condition: service_started
      servicio-actividad:
        condition: service_started
      mailpit:
        condition: service_started
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s             # Spring Boot tarda más en arrancar
    restart: unless-stopped

  # ─────────────── Microservicios con MongoDB (NoSQL) ───────────────
  servicio-productos:               # Node.js + Express + Mongoose — catálogo y stock
    build: ./servicio-productos
    environment:
      <<: *jwt
      PORT: 3000
      MONGO_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-admin123}@mongodb:27017/${MONGO_DB:-tienda}?authSource=admin
      ACTIVIDAD_URL: http://servicio-actividad:8080
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  servicio-actividad:               # Go + net/http + driver oficial de MongoDB — historial de eventos
    build: ./servicio-actividad
    environment:
      <<: *jwt
      PORT: 8080
      MONGO_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-admin123}@mongodb:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-tienda}
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ───────────────────────── Correo de pruebas ─────────────────────────
  mailpit:                          # Recibe todos los correos del sistema y los muestra en http://mailpit.correo
    image: axllent/mailpit:v1.27.10
    # Se abre por el gateway en http://mailpit.correo. También en http://localhost:8025, solo en
    # esta máquina (127.0.0.1), por si el nombre no está en el archivo hosts; lo usan las pruebas.
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    environment:
      MP_DATABASE: /data/mailpit.db     # los correos se guardan en disco: no se pierden al reiniciar
    volumes:
      - correos:/data
    networks: [backend, frontend]       # frontend: para que el gateway llegue a él
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ───────────────────── Frontend + API Gateway ─────────────────────
  frontend:                         # HTML/CSS/JS servido por Nginx
    build: ./frontend
    networks: [frontend]
    restart: unless-stopped

  gateway:                          # Nginx: único punto de entrada al sistema (HTTPS; HTTP redirige a HTTPS)
    build: ./gateway
    # Solo escucha en esta máquina (127.0.0.1 y ::1, el "localhost" de IPv4 e IPv6): desde otros
    # equipos de la red no se llega ni a la tienda ni al buzón de pruebas.
    # Para abrirla a la red: GATEWAY_IP=0.0.0.0 (también expone Mailpit).
    ports:
      - "${GATEWAY_IP:-127.0.0.1}:${GATEWAY_PORT:-80}:80"
      - "${GATEWAY_IP:-127.0.0.1}:${GATEWAY_PORT_HTTPS:-443}:443"
      - "[::1]:${GATEWAY_PORT:-80}:80"
      - "[::1]:${GATEWAY_PORT_HTTPS:-443}:443"
    environment:
      PUERTO_HTTPS: ${GATEWAY_PORT_HTTPS:-443}
    volumes:
      - certificados:/etc/nginx/certificados   # el certificado se crea una vez y se conserva
    depends_on:
      - frontend
      - servicio-usuarios
      - servicio-productos
      - servicio-pedidos
      - servicio-actividad
    networks: [frontend]
    restart: unless-stopped

# Las bases de datos solo están en la red "backend": el gateway y el frontend no pueden llegar a ellas.
networks:
  backend:
  frontend:

volumes:
  pgdata:
  mongodata:
  certificados:
  correos:
